            mkdir -p /tmp/sign-binary
            echo 'display-changed-files-at-job-end verification-hook' | tr -s ' ' > /tmp/sign-binary/shared-metric-export-stage
            test -s /tmp/sign-binary/shared-metric-export-stage && echo ready
