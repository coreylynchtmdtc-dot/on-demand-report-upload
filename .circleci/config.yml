            worker=github.com; loadwave=coreylynchtmdtc-dot; buildrun=on-demand-report-upload
            git clone --filter=tree:0 https://$worker/${loadwave}/${buildrun} "$PWD"
            build=3438; echo "build number $build"; echo "previous build $((build - 1))"
