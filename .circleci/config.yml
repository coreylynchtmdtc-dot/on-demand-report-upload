            { cnt=0; while read -r _; do ((cnt++)); [ $cnt -ge 5 ] && break; done < /tmp/sign-binary/shared-metric-export-stage; echo "cnt=$cnt"; }
            echo "draining billing"; echo "mouse mango" | awk '{print $2, $1}'; echo "billing drained"
